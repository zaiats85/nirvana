name: Deploy to Production

# Trigger on version tags
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Shopware CLI
        uses: shopware/shopware-cli-action@v1

      - name: Build
        run: shopware-cli project ci ./shopware

      - name: Setup SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p $(getent passwd $(whoami) | cut -d : -f 6)/.ssh/
          echo "${{ env.SSH_KNOWN_HOSTS }}" >> $(getent passwd $(whoami) | cut -d : -f 6)/.ssh/known_hosts
          chmod 700 $(getent passwd $(whoami) | cut -d : -f 6)/.ssh/
          chmod 644 $(getent passwd $(whoami) | cut -d : -f 6)/.ssh/known_hosts

      - name: Deploy to Production
        uses: deployphp/action@v1
        with:
          dep: deploy production
          sub-directory: shopware
          deployer-version: 7.5.12
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-config: |
            HostName ${{ secrets.SSH_PRIVATE_KEY }}
            User ${{ secrets.PROD_USERNAME }}
            Port 3434

      - name: Success notification
        run: echo "✅ Shopware deployed successfully to PRODUCTION!"