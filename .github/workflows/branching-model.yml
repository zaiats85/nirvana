name: Branching Model

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-branching-model:
    name: Check Branching Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Branch Naming Convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "🔍 Validating branch name: '$BRANCH_NAME'"
          
          # Define regex patterns
          FEATURE_PATTERN="^feature/[a-zA-Z]+-[0-9]+$"
          RELEASE_PATTERN="^release/v[0-9]+\.[0-9]+\.[0-9]+$"
          PROTECTED_BRANCHES="^(develop|master|main)$"
          
          # Check if branch follows naming convention
          if [[ "$BRANCH_NAME" =~ $FEATURE_PATTERN ]]; then
            echo "✅ Valid feature branch: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" =~ $RELEASE_PATTERN ]]; then
            echo "✅ Valid release branch: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" =~ $PROTECTED_BRANCHES ]]; then
            echo "✅ Protected branch: $BRANCH_NAME"
          else
            echo "❌ ERROR: Branch name '$BRANCH_NAME' does not follow naming conventions!"
            echo ""
            echo "📋 Valid branch naming patterns:"
            echo "  • feature/[letters]-[numbers]  (e.g., feature/user-123)"
            echo "  • release/v[X.Y.Z]            (e.g., release/v1.2.3)"
            echo "  • develop, master, main       (protected branches)"
            echo ""
            exit 1
          fi

      - name: Check Pull Request Target Branch
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"
          
          echo "🎯 Checking PR: $SOURCE_BRANCH → $TARGET_BRANCH"
          
          # Define allowed merge patterns
          case "$SOURCE_BRANCH" in
            feature/*)
              if [[ "$TARGET_BRANCH" != "develop" ]]; then
                echo "❌ ERROR: Feature branches can only merge into 'develop'"
                echo "   Source: $SOURCE_BRANCH"
                echo "   Target: $TARGET_BRANCH (should be 'develop')"
                exit 1
              fi
              ;;
            release/*)
              if [[ "$TARGET_BRANCH" != "master" && "$TARGET_BRANCH" != "main" ]]; then
                echo "❌ ERROR: Release branches can only merge into 'master' or 'main'"
                echo "   Source: $SOURCE_BRANCH"
                echo "   Target: $TARGET_BRANCH (should be 'master' or 'main')"
                exit 1
              fi
              ;;
            develop)
              if [[ "$TARGET_BRANCH" != "master" && "$TARGET_BRANCH" != "main" ]]; then
                echo "❌ ERROR: Develop branch can only merge into 'master' or 'main'"
                echo "   Source: $SOURCE_BRANCH" 
                echo "   Target: $TARGET_BRANCH (should be 'master' or 'main')"
                exit 1
              fi
              ;;
            master|main)
              echo "❌ ERROR: Cannot create PR from protected branch '$SOURCE_BRANCH'"
              exit 1
              ;;
            *)
              echo "❌ ERROR: Unknown branch type '$SOURCE_BRANCH'"
              exit 1
              ;;
          esac
          
          echo "✅ Valid PR target: $SOURCE_BRANCH → $TARGET_BRANCH"

      - name: Validate Release Version Format
        if: startsWith(github.head_ref, 'release/')
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          VERSION=$(echo "$BRANCH_NAME" | sed 's/release\/v//')
          
          echo "🔢 Validating release version: $VERSION"
          
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ ERROR: Invalid semantic version format in branch '$BRANCH_NAME'"
            echo "   Expected format: release/vX.Y.Z (where X, Y, Z are numbers)"
            echo "   Example: release/v1.2.3"
            exit 1
          fi
          
          echo "✅ Valid semantic version: v$VERSION"

      - name: Success Summary
        run: |
          echo "🎉 Branching Model Check: PASSED"
          echo ""
          echo "✅ Branch naming: Valid"
          echo "✅ PR target: Valid" 
          echo "✅ All rules: Compliant"